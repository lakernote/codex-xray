name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release type"
        required: true
        type: choice
        default: prerelease
        options:
          - prerelease
          - release
      version:
        description: "Version without v (for example 0.2.0-beta.1 or 0.2.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.channel }} v${{ inputs.version }}
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      matrix: ${{ steps.metadata.outputs.matrix }}
      tag_exists: ${{ steps.metadata.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Resolve release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            tag_exists=true
          else
            tag_exists=false
          fi

          if [ "${RELEASE_CHANNEL}" = "prerelease" ]; then
            if [[ "${RELEASE_VERSION}" != *-* ]]; then
              echo "::error::Prerelease versions need a suffix such as beta.1."
              exit 1
            fi
            prerelease=true
          else
            if [[ "${RELEASE_VERSION}" == *-* ]]; then
              echo "::error::Stable release versions cannot contain a prerelease suffix."
              exit 1
            fi
            prerelease=false
          fi

          release_json="${RUNNER_TEMP}/release.json"
          release_found=false
          if [ "${tag_exists}" = "true" ] && gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -s -e --arg tag "${tag}" '[.[][] | select(.tag_name == $tag)][0]' > "${release_json}"; then
            release_found=true
            if [ "$(jq -r '.draft' "${release_json}")" != "true" ]; then
              echo "::error::Release ${tag} is already published and cannot be rebuilt."
              exit 1
            fi

            while read -r asset_id; do
              [ -z "${asset_id}" ] || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done < <(
              jq -r '.assets[]
                | select(.name | endswith(".AppImage") or endswith(".app.tar.gz"))
                | .id' "${release_json}"
            )
          fi

          if [ "${release_found}" != "true" ]; then
            printf '{"assets":[]}\n' > "${release_json}"
          fi

          include='[]'
          add_target() {
            include="$(jq -cn \
              --argjson current "${include}" \
              --arg platform "$1" \
              --arg args "$2" \
              '$current + [{platform: $platform, args: $args}]')"
          }
          has_asset() {
            jq -e --arg suffix "$1" \
              '.assets | any(.[]; .name | endswith($suffix))' \
              "${release_json}" >/dev/null
          }

          has_asset "_aarch64.dmg" || add_target macos-latest "--target aarch64-apple-darwin --bundles dmg"
          has_asset "_x64.dmg" || add_target macos-latest "--target x86_64-apple-darwin --bundles dmg"
          if ! has_asset "_amd64.deb" || ! has_asset ".x86_64.rpm"; then
            add_target ubuntu-22.04 "--bundles deb,rpm"
          fi
          has_asset "_x64-setup.exe" || add_target windows-latest "--bundles nsis"

          if [ "$(jq 'length' <<< "${include}")" -eq 0 ]; then
            echo "::error::Draft ${tag} already contains every installer."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -cn --argjson include "${include}" '{include: $include}')" >> "$GITHUB_OUTPUT"
      - name: Check out existing release tag
        if: steps.metadata.outputs.tag_exists == 'true'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: git checkout --detach "${RELEASE_TAG}"
      - run: npm ci
      - name: Synchronize application version
        if: steps.metadata.outputs.tag_exists != 'true'
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm run version:set -- "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL"
      - run: npm run version:check -- --tag "${{ steps.metadata.outputs.tag }}" --channel "${{ inputs.channel }}"
      - run: git diff --check
      - name: Commit version and create tag
        if: steps.metadata.outputs.tag_exists != 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare ${RELEASE_TAG}"
          fi
          git tag -a "${RELEASE_TAG}" -m "Codex X-Ray ${RELEASE_TAG}"
          git push --atomic origin "HEAD:refs/heads/${DEFAULT_BRANCH}" "refs/tags/${RELEASE_TAG}"

  verify:
    name: Verify release
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm run version:check -- --tag "${{ needs.prepare.outputs.tag }}"
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  publish:
    name: Build ${{ matrix.platform }}
    needs:
      - prepare
      - verify
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Codex X-Ray ${{ needs.prepare.outputs.tag }}"
          releaseBody: |
            Choose the installer for your system:

            - macOS Apple Silicon: `_aarch64.dmg`
            - macOS Intel: `_x64.dmg`
            - Windows 64-bit: `_x64-setup.exe`
            - Ubuntu / Debian 64-bit: `_amd64.deb`
            - Fedora / RHEL 64-bit: `.x86_64.rpm`

            These builds are not yet signed with a trusted publisher certificate or notarized. See `CHANGELOG.md` for changes.
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          retryAttempts: 0
          args: ${{ matrix.args }}
